camera:
  index: 0
  width: 640
  height: 480

ear:
  threshold: 0.21
  drowsy_seconds: 1.5

head_pose:
  yaw_threshold: 25          
  pitch_down_threshold: 20   
  away_seconds: 2.0       

object_detector:
  model: "yolov8n.pt"          # auto-downloads on first run
  confidence: 0.45             # minimum detection score
  target_classes:              # COCO class names to watch for
    - "cell phone"
    - "cup"
    - "bottle"
    - "sandwich"
    - "banana"
    - "apple"
    - "pizza"
    - "donut"
  use_seconds: 1.5             # holding/using item this long = Distracted

behavior_classifier:
  ear_threshold: 0.21
  drowsy_seconds: 1.5
  away_seconds: 2.0
  object_use_seconds: 1.5
  log_csv: "data/events.csv"


alert_manager:
  sound_enabled: true          # set to false if simpleaudio fails to build
  cooldown_seconds: 3.0        # minimum seconds between repeated audio alarms